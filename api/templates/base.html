<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Bazaar{% endblock %}</title>
    <style>
        :root {
            --ink: #1c1915;
            --muted: #5c564c;
            --paper: #f3efe6;
            --card: #fffdf8;
            --line: #ddd4c4;
            --green: #1f4d3a;
            --green-dark: #16382a;
            --danger: #9f1239;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: var(--paper);
            font: 16px/1.5 "Segoe UI", sans-serif;
        }
        a { color: var(--green); }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 24px;
            background: var(--green);
            color: #f7f3ea;
        }
        header a { color: inherit; text-decoration: none; }
        header strong { font-family: Georgia, serif; font-size: 22px; letter-spacing: 0.02em; }
        header form { margin: 0; }
        button, .button {
            border: 0;
            border-radius: 6px;
            padding: 8px 14px;
            background: #f3efe6;
            color: var(--green-dark);
            font: inherit;
            cursor: pointer;
        }
        .messages { list-style: none; padding: 0; margin: 0 0 16px; }
        .messages li { margin-bottom: 8px; padding: 10px 12px; border-radius: 6px; background: #ecfdf3; }
        .messages .error { background: #fff1f2; color: var(--danger); }
        main { padding: 28px 20px 48px; }
        .wrap { width: min(1100px, 100%); margin: 0 auto; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <a href="{% url 'home' %}"><strong>Bazaar</strong></a>
        {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <span style="margin-right: 12px;">{{ user.username }}</span>
            <button type="submit">Log out</button>
        </form>
        {% else %}
        <nav>
            <a href="{% url 'login' %}">Log in</a>
            <a href="{% url 'register' %}" style="margin-left: 16px;">Create account</a>
        </nav>
        {% endif %}
    </header>
    <main>
        <div class="wrap">
            {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
